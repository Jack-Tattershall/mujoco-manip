# Hydra config for bottle-packing dataset generation.
repo_id: null  # Required: e.g. user/bottle-packing-v1
num_episodes: 100
root: ./datasets

# Task mode: "random" shuffles well order per run; "sequential" packs 0,1,2,...
task: random

# Wells to exclude from the schedule (list of 0–19 indices).
# Bottles will never be placed in these wells.  Useful for holding out
# wells during training so a VLA can be evaluated on unseen targets.
excluded_wells: null

# Number of bottles to pack per run (each bottle = 1 episode).
# null = all available wells (20 minus any excluded).
num_bottles: null

reward_type: staged
seed: 42

# Optional feature subset (null = all)
features: null

# HuggingFace Hub
push_to_hub: false
private: true
